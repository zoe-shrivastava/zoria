version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: zoria-postgres
    environment:
      POSTGRES_DB: zoria
      POSTGRES_USER: zoria
      POSTGRES_PASSWORD: zoria_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zoria"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zoria-backend
    environment:
      DATABASE_URL: postgresql://zoria:zoria_password@postgres:5432/zoria
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: zoria-frontend-dev
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE=http://localhost:8001
    depends_on:
      - backend
    command: npm run dev
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  uploads:
