<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Comprehensive Concept & Edge Parser</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 20px; background-color: #f0f2f5; color: #1c1e21; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 180px; margin: 10px 0; padding: 12px; border: 1px solid #ccd0d5; border-radius: 6px; font-family: monospace; box-sizing: border-box; }
        button { padding: 12px 24px; background: #1877f2; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 15px; }
        button:hover { background: #166fe5; }
        
        h3 { border-bottom: 2px solid #eee; padding-bottom: 8px; margin-top: 30px; color: #4b4f56; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #f5f6f7; color: #4b4f56; }
        
        .list-container { display: flex; gap: 20px; margin-top: 20px; }
        .list-box { flex: 1; background: #f9f9f9; padding: 15px; border-radius: 8px; border: 1px solid #ddd; }
        .list-box ul { padding-left: 20px; }
        .list-box li { margin-bottom: 5px; font-family: monospace; font-size: 13px; }
        
        .badge { padding: 3px 8px; border-radius: 10px; font-size: 11px; font-weight: bold; color: white; text-transform: uppercase; }
        .easy { background: #42b72a; }
        .error { color: #d32f2f; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Comprehensive Concept Parser</h2>
    <p>Paste the full JSON object (including <code>concepts_json</code> and <code>relationships</code>) below:</p>
    
    <textarea id="jsonInput" placeholder="Paste full JSON here..."></textarea>
    <br>
    <button onclick="processData()">Parse Document Data</button>
    <div id="errorLog" class="error"></div>

    <div id="resultsArea" style="display:none;">
        
        <h3>1. Attribute Summary</h3>
        <table id="summaryTable">
            <thead><tr><th>Attribute</th><th>Count</th><th>Details</th></tr></thead>
            <tbody id="summaryBody"></tbody>
        </table>

        <h3>2. Concept Details (Mapping)</h3>
        <table id="detailTable">
            <thead>
                <tr>
                    <th>Concept Name</th>
                    <th>Subtopic</th>
                    <th>Difficulty</th>
                    <th>Prerequisites</th>
                </tr>
            </thead>
            <tbody id="detailBody"></tbody>
        </table>

        <div class="list-container">
            <div class="list-box">
                <h3>Unique Concepts</h3>
                <ul id="conceptList"></ul>
            </div>
            <div class="list-box">
                <h3>Unique Edges (Relationships)</h3>
                <ul id="edgeList"></ul>
            </div>
        </div>
    </div>
</div>

<script>
    function processData() {
        const input = document.getElementById('jsonInput').value;
        const errorLog = document.getElementById('errorLog');
        const resultsArea = document.getElementById('resultsArea');
        
        errorLog.innerText = "";
        
        try {
            const data = JSON.parse(input);
            const cJson = data.concepts_json.concepts || [];
            const rootConcepts = data.concepts || [];
            const relationships = data.relationships || [];

            // --- 1. Summary Logic ---
            const subtopics = [...new Set(cJson.map(c => c.subtopic))];
            const topics = [...new Set(cJson.map(c => c.topic_name))];
            const questions = cJson.flatMap(c => c.questions || []);
            const qTypes = [...new Set(questions.map(q => q.type))];

            const summaryRows = [
                ["Concepts", cJson.length, subtopics.join(", ")],
                ["Questions", questions.length, "Total conceptual questions found"],
                ["Unique Question Types", qTypes.length, qTypes.join(", ")],
                ["Topic Count", topics.length, topics.join(", ")],
                ["Subtopic Count", subtopics.length, subtopics.join(", ")]
            ];

            const sBody = document.getElementById('summaryBody');
            sBody.innerHTML = summaryRows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('');

            // --- 2. Detail Logic (Unique Rows) ---
            const dBody = document.getElementById('detailBody');
            dBody.innerHTML = "";
            const seen = new Set();
            cJson.forEach(item => {
                if (!seen.has(item.subtopic)) {
                    seen.add(item.subtopic);
                    const diffClass = (item.difficulty || "easy").toLowerCase();
                    dBody.innerHTML += `
                        <tr>
                            <td>${item.topic_name}</td>
                            <td><strong>${item.subtopic}</strong></td>
                            <td><span class="badge ${diffClass}">${item.difficulty}</span></td>
                            <td>${item.prerequisites.length > 0 ? item.prerequisites.join(", ") : "None"}</td>
                        </tr>`;
                }
            });

            // --- 3. Unique Concepts List ---
            const cList = document.getElementById('conceptList');
            cList.innerHTML = rootConcepts.map(c => `<li>${c.name} (${c.id.substring(0,8)}...)</li>`).join('');

            // --- 4. Unique Edges List ---
            const eList = document.getElementById('edgeList');
            const uniqueEdges = relationships.map(r => `${r.from_concept_name} &rarr; ${r.to_concept_name}`);
            const distinctEdges = [...new Set(uniqueEdges)];
            eList.innerHTML = distinctEdges.map(e => `<li>${e}</li>`).join('');

            resultsArea.style.display = "block";

        } catch (e) {
            errorLog.innerText = "Error: " + e.message;
            resultsArea.style.display = "none";
        }
    }
</script>

</body>
</html>
