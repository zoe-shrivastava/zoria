<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zoria - Learning Platform</title>
    <!-- KaTeX CSS for LaTeX rendering -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
    />
    <!-- KaTeX core and auto-render (global) -->
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
    ></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
    ></script>
    <!-- TikZJax for rendering TikZ diagrams -->
    <!-- Note: If TikZJax doesn't load, diagrams will show a fallback message -->
    <link rel="stylesheet" type="text/css" href="https://tikzjax.com/v1/fonts.css">
    <script src="https://tikzjax.com/v1/tikzjax.js" 
            onload="console.log('TikZJax script onload fired'); console.log('window.tikzjax:', window.tikzjax); console.log('window keys:', Object.keys(window).slice(0, 20));" 
            onerror="console.error('TikZJax script failed to load - check Network tab'); window.tikzjaxLoadError = true;">
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
